services:
  pomodoro:
    build: .
    image: pomodoro-tracker
    ports:
      - "3000:3000"
    volumes:
      # Named volume: this is what makes tasks survive a redeploy.
      - pomodoro-data:/data
    environment:
      POMODORO_DATA_DIR: /data
    restart: unless-stopped

volumes:
  pomodoro-data:
